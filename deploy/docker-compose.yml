services:
  db:
    image: postgres:16
    container_name: flowio-db
    environment:
      POSTGRES_DB: flowio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - flowio_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: flowio-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: flowio-backend
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ../backend:/app
      - flowio_storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: flowio-frontend
    environment:
      NODE_ENV: production
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: flowio-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  flowio_db:
  flowio_storage:
