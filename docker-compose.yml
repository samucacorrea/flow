version: '3.9'

services:
  db:
    image: postgres:16
    container_name: flowio-postgres
    environment:
      POSTGRES_DB: flowio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - flowio_pg:/var/lib/postgresql/data

volumes:
  flowio_pg:
